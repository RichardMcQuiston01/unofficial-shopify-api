name: Publish

# Publishes to NPM when a version tag such as v1.0.0 is pushed. The tagged
# commit must already be on `main` and the tag must match package.json, so a
# tag on another branch or a mistyped tag cannot publish anything.
#
# Pushes made with the default GITHUB_TOKEN do not start workflows, so create
# the tag yourself (git push, or "Draft a new release" on GitHub).

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub release
  id-token: write # NPM provenance

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main. Merge to main first, then tag that commit."
            exit 1
          fi
      - name: Require the tag to match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Merge the version PR, then tag v${version}."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - name: Publish to NPM
        run: |
          # A prerelease such as v1.1.0-beta.1 goes to the "next" tag, never "latest".
          case "${GITHUB_REF_NAME}" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Create the GitHub release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A release for ${GITHUB_REF_NAME} already exists; leaving it as is."
          else
            case "${GITHUB_REF_NAME}" in
              *-*) flag="--prerelease" ;;
              *) flag="" ;;
            esac
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes ${flag}
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
